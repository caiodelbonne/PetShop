<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop</title>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <a href="index.html" class="link">
        <img src="./assets/logo.svg" alt="Logo Mundo Pet">
        Mundo Pet
    </a>

    <aside class="content">
        <div class="content-header">
            <h1>Sua Agenda</h1>
            <div class="content-date">
                <input type="date" id="filter-date">
            </div>
        </div>
        <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
        <div id="agendamentos-container"></div>
    </aside>
    

    <!-- Agendamentos -->
    <section class="content" id="manha">
        <header>
            <img src="./assets/icon/manha.svg" alt="Manhã">
            <strong>Manhã</strong>
            <samp>07h-12h</samp>
        </header>
        <ul> <!-- recebi via api -->
        </ul>
    </section>

    <section class="content" id="tarde">
        <header>
            <img src="./assets/icon/tarde.svg" alt="Tarde">
            <strong>Tarde</strong>
            <samp>12:30h-18h</samp>
        </header>
        <ul>
            <!-- recebi via api -->
        </ul>
    </section>

    <section class="content" id="noite">
        <header>
            <img src="./assets/icon/noite.svg" alt="Noite">
            <strong>Noite</strong>
            <samp>18:00h-23h</samp>
        </header>
        <ul>
            <!-- recebi via api -->

        </ul>
    </section>

    <div class="btn-agendamento">
        <button id="btn-novo-agendamento">Novo agendamento</button>
    </div>

    <!-- Modal de Agendamento -->
    <div class="modal" id="modal-agendamento" role="dialog" aria-labelledby="modal-title">
        <div class="modal-content">
            <button class="close-modal" id="close-modal" aria-label="Fechar modal">X</button>
            <h2 id="modal-title">Agende um atendimento</h2>
            <p>Preencha os dados do cliente para realizar o agendamento:</p>
            <form action="#" method="POST" id="form-agendamento">
                <label for="dono-dog">Nome do tutor</label>
                <input type="text" id="dono-dog" name="dono-dog" required>

                <label for="dog-nome">Nome do pet</label>
                <input type="text" id="dog-nome" name="dog-nome" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

                <label for="servico">Serviço:</label>
                <select id="servico" name="servico" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="vacina">Vacina</option>
                    <option value="banho_tosa">Banho e Tosa</option>
                    <option value="consulta">Consulta</option>
                </select>

                <label for="observacao">Observação:</label>
                <textarea id="observacao" name="observacao" rows="4"></textarea>

                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>

                <label for="hora">Horário:</label>
                <input type="time" id="hora" name="hora" required>

                <button type="submit">Agendar</button>
            </form>
        </div>
    </div>

    <script type="module" src="src/script.js"></script>
</body>

</html>
