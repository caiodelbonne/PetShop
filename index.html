<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop</title>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <a href="index.html" class="link">
        <img src="./assets/logo.svg" alt="">
        Mundo Pet
    </a>

    <aside class="content">
        <div class="content-header">
            <h1>Sua Agenda</h1>
            <div class="content-date">
                <input type="date">
            </div>
        </div>
        <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
    </aside>
    
    
    <!-- agendamento de manha  .. css em listas.css  -->
   <section class="content">
        <header>
            <img src="./assets/icon/manha.svg" alt="manha">
            <strong>Manha</strong>
            <samp>09h-12h</samp>
        </header>
        <!-- lista de agendamento periodo de manha -->
        <ul>
            <li>
                <strong>10:00</strong>
                <strong>Amora/ Caio Cesar</strong>
                <span>Vacina</span>
                <button>Remover agendamento</button>
            </li>
        </ul>
    </section>


     <!-- agendamento de tarde  -->
   <section class="content">
    <header>
        <img src="./assets/icon/tarde.svg" alt="icone afternoon">
        <strong>Tarde</strong>
        <samp>12:30h-18h</samp>
    </header>
    <!-- lista de agendamento periodo de tarde -->
    <ul>
        <li>
            <strong>15:00</strong>
            <strong>Jhade/ Caio Cesar</strong>
            <span>Banho e tosa</span>
            <button>Remover agendamento</button>
        </li>
    </ul>
</section>

 <!-- agendamento de noite  -->
 <section class="content">
    <header>
        <img src="./assets/icon/noite.svg" alt="icone lua cheia">
        <strong>Noite</strong>
        <samp>18:00h-23h</samp>
    </header>
    <!-- lista de agendamento periodo noturno -->
    <ul>
        <li>
            <strong>21:00</strong>
            <strong>Ohanna/ Del Bonne</strong>
            <span>Consulta</span>
            <button>Remover agendamento</button>
        </li>
    </ul>
</section>

<div class="btn-agendamento ">
    <button>Novo agendamento</button>
</div>

</body>

</html>
